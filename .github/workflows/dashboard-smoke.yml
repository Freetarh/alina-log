name: Dashboard smoke test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app shell, WHO data and module rendering
        run: node --test tests/dashboard-smoke.test.cjs
