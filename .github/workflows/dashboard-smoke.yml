name: Dashboard smoke test

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.css'
      - '**/*.html'
      - '**/*.webmanifest'
      - '.github/workflows/dashboard-smoke.yml'
  pull_request:
    branches: [main]

concurrency:
  group: dashboard-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of test suite
        run: node --check tests/dashboard-smoke.test.cjs
      - name: Check app shell, WHO data and module rendering
        run: node --test tests/dashboard-smoke.test.cjs
